[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shiny-bot"
version = "0.1.0"
description = "Profile-driven Pokemon SoulSilver shiny-hunting bot"
requires-python = ">=3.12"
dependencies = [
    "Pillow",
    "opencv-python",
    "numpy",
    "pytesseract",
    "keyboard",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]